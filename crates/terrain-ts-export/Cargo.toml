[package]
name = "terrain-ts-export"
description = "Export Rust IPC types to TypeScript for the Terrain desktop UI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "export-ts-types"
path = "src/main.rs"

[dependencies]
terrain-core = { workspace = true, features = ["ts-export", "repomix"] }
terrain-dashboard = { workspace = true, features = ["ts-export"] }
terrain-agent = { workspace = true, features = ["ts-export"] }
ts-rs = { workspace = true }
